name: Demo action from another repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-24.04
    steps:
      - name: Run the action from another repository
        uses: sfdcale/ep-lab-action@3bc96605d08d16ba72f694861fb11ab573af1ac6
        with:
          project: billing
