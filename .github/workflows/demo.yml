name: Demo action from another repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-24.04
    steps:
      - name: Run the action from another repository
        uses: sfdcale/ep-lab-action@b149a0d2f5d75fa2c51e63129f737366f3ffd7d4
        with:
          project: billing
